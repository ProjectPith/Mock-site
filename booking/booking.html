<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand-Place-Holder | Booking & Estimator</title>

  <!-- Global Base Styles -->
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/nav/nav.css">

  <!-- Feature-Specific Style -->
  <link rel="stylesheet" href="booking.css">
</head>
<body>

  <!-- Dynamic Navigation Bar Placeholder -->
  <div id="nav-placeholder"></div>

  <!-- Booking Main Content -->
  <main class="booking-container">
    <div class="booking-header">
      <h1>Bookings & Project Estimator</h1>
      <p style="color: var(--text-muted);">Select a service to schedule your session or get an estimate.</p>
    </div>

    <div class="booking-grid">
      <!-- Service Selection Column -->
      <div class="service-list">
        <h3>Available Services</h3>
        <div id="services-list"></div>
      </div>

      <!-- Reservation Form Column -->
      <div class="booking-form-card">
        <h3>Schedule Session</h3>
        <br>
        <form id="booking-form">
          <div class="form-group">
            <label for="selected-service-display">Selected Package</label>
            <input type="text" id="selected-service-display" value="Select a service from the left" readonly>
          </div>

          <div class="form-group">
            <label for="booking-date">Target Date</label>
            <input type="date" id="booking-date" required>
          </div>

          <div class="form-group">
            <label for="booking-time">Preferred Time</label>
            <input type="time" id="booking-time" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm Reservation</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Global & Component Scripts -->
  <script src="/js/global.js"></script>
  <script src="/nav/nav.js"></script>

  <!-- Feature-Specific Script -->
  <script src="booking.js"></script>
</body>
</html>
