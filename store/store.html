<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand-Place-Holder | Store</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/nav/nav.css">
  <link rel="stylesheet" href="store.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <!-- Store Content -->
  <main class="store-container">
    <div class="store-header">
      <h1>Official Store</h1>
      <p style="color: var(--text-muted);">Official Gear & Custom Web Development Services</p>
    </div>

    <div id="products-grid" class="products-grid"></div>
  </main>

  <!-- Cart & Auth Shared Drawer/Modal Components -->
  <div id="cart-overlay" class="cart-overlay" onclick="toggleCart(false)"></div>
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="close-btn" onclick="toggleCart(false)">&times;</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <strong id="cart-total-price">$0.00</strong>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="openCheckout()">Checkout</button>
    </div>
  </div>

  <script src="/js/global.js"></script>
  <script src="/nav/nav.js"></script>
  <script src="store.js"></script>
</body>
</html>
