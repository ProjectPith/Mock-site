<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Dashboard | LunarCraft</title>
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="/dashboard/dashboard.css">
  <!-- Supabase JS Client & Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/chat/chat-engine.js"></script>
</head>
<body class="dashboard-body">
  
  <div id="site-header-container"></div>

  <div class="dashboard-layout">
    <!-- LEFT SIDEBAR: Hidden on Mobile -->
    <aside class="sidebar-tools">
      <div class="sidebar-header">
        <h3>Tool Bookmarks</h3>
        <button id="add-tool-btn" class="btn-icon" title="Add Bookmark">+</button>
      </div>
      <div id="tools-list" class="tools-list">
        <!-- Bookmark boxes render here dynamically -->
      </div>
    </aside>

    <!-- MAIN DASHBOARD CONTENT AREA -->
    <main class="dashboard-main">
      
      <!-- ACTIVE PROJECTS SECTION -->
      <section class="projects-container">
        <div class="section-header">
          <h2>Active Projects</h2>
          <button id="start-contract-btn" class="btn btn-primary hide-mobile">+ New Contract</button>
        </div>

        <div class="table-wrapper">
          <table class="dashboard-table">
            <thead>
              <tr>
                <th>Project</th>
                <th class="hide-mobile">Client</th>
                <th>Status</th>
                <th class="hide-mobile">Links</th>
                <th class="hide-mobile">Action</th>
              </tr>
            </thead>
            <tbody id="projects-table-body">
              <!-- Dynamic Projects Render Here -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- RIGHT COLUMN: Payout & Chat -->
      <aside class="right-column">
  
        <!-- ESTIMATED PAYOUT WIDGET -->
        <a href="../bookkeeping/bookkeeping.html" class="payout-container-link">
          <div id="payout-card" class="payout-container">
            <div class="payout-header">
              <span>Estimated Net Payout</span>
              <span class="arrow-icon">→</span>
            </div>
            <div class="payout-amount" id="net-payout-display">$0.00</div>
            <div class="payout-breakdown">
              <small id="payout-gross">Gross: $0.00</small>
              <small id="payout-deductions">Deductions: -$0.00</small>
            </div>
          </div>
        </a>

        <!-- INTERACTIVE RECENT MESSAGES WIDGET -->
        <div class="messages-container">
          <div class="section-header messages-widget-header">
            <h3>Recent Messages</h3>
            <select id="dash-room-select" class="dash-room-select">
              <option value="">Select Room...</option>
            </select>
          </div>
          
          <div id="messages-list" class="messages-list">
            <div class="message-placeholder">
              <p>Loading active client chats...</p>
            </div>
          </div>

          <!-- Inline Quick Reply Form -->
          <form id="dash-chat-form" class="dash-chat-form">
            <input type="text" id="dash-chat-input" placeholder="Quick reply..." disabled required autocomplete="off" />
            <button type="submit" id="dash-chat-send" class="btn btn-sm" disabled>Send</button>
          </form>
        </div>

      </aside>
    </main>
  </div>

  <!-- MODAL: Add Tool Bookmark -->
  <div id="tool-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-tool-modal" class="close-btn">&times;</span>
      <h3>Add Tool Bookmark</h3>
      <form id="add-tool-form">
        <div class="form-group">
          <label for="tool-name">Tool Name</label>
          <input type="text" id="tool-name" placeholder="e.g. Supabase, GitHub" required>
        </div>
        <div class="form-group">
          <label for="tool-url">Tool URL</label>
          <input type="url" id="tool-url" placeholder="https://..." required>
        </div>
        <button type="submit" class="btn btn-primary">Save Bookmark</button>
      </form>
    </div>
  </div>

  <script src="/bookkeeping/bookkeeping.js"></script>
  <script src="/dashboard/dashboard.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
