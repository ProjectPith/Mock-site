<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LunarCraft | Messages</title>
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="../messages/messages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rpfclpfipqspbdbanobj.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwZmNscGZpcHFzcGJkYmFub2JqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTYyMzA0MywiZXhwIjoyMTA1MTk5MDQzfQ.b-QuyXcDsSF0heCqbs29Rp8whNxGqsA8ASTtlm6_HHk"; 
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
</head>
<body>

  <div id="site-header-container"></div>

  <div class="chat-layout">
    <!-- Sidebar: Room List -->
    <aside class="chat-sidebar">
      <div class="sidebar-header">
        <h3>Messages</h3>
        <button id="open-new-chat-modal" class="btn btn-primary btn-sm">+ New Chat</button>
      </div>
      <div id="rooms-list" class="rooms-list">
        <!-- Room cards render here -->
      </div>
    </aside>

    <!-- Main Chat Container -->
    <main class="chat-main">
      <div id="no-chat-selected" class="empty-chat-state">
        <p>Select a client conversation or start a new chat.</p>
      </div>

      <div id="active-chat-container" class="active-chat-container hidden">
        <!-- Room Header -->
        <header class="chat-header">
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <!-- Mobile Back Button -->
            <button id="mobile-back-btn" class="mobile-back-btn" aria-label="Back to messages">
              <span class="back-circle-outer">
                <span class="back-circle-inner">‹</span>
              </span>
            </button>

            <div>
              <h2 id="active-room-title">Client Name</h2>
              <small id="active-room-subtitle">client@email.com</small>
            </div>
          </div>
        </header>

        <!-- Message Feed -->
        <div id="messages-feed" class="messages-feed">
          <!-- Messages stream here in real time -->
        </div>

        <!-- Input Area -->
        <form id="message-form" class="chat-input-container">
          <input 
            type="text" 
            id="message-input" 
            placeholder="Type your message..." 
            autocomplete="off"
            required
          >
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>
    </main>
  </div>

  <!-- New Chat Modal -->
  <div id="new-chat-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Start New Client Chat</h3>
      <form id="new-chat-form">
        <div class="form-group">
          <label for="modal-room-name">Room / Project Name</label>
          <input type="text" id="modal-room-name" placeholder="e.g. Website Overhaul" required>
        </div>
        <div class="form-group">
          <label for="modal-client-name">Client Name</label>
          <input type="text" id="modal-client-name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="modal-client-email">Client Email</label>
          <input type="email" id="modal-client-email" placeholder="john@example.com" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Room</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/chatEngine.js"></script>
  <script src="/messages/messages.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
