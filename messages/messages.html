<!-- New Chat Modal -->
<div id="create-room-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Start New Chat</h3>
    <form id="create-room-form">
      
      <!-- Developer Quick Checkbox -->
      <div class="form-group checkbox-group">
        <label for="modal-dev-checkbox" class="checkbox-label">
          <input type="checkbox" id="modal-dev-checkbox">
          <span>Include Developer Support (LunarCraft)</span>
        </label>
      </div>

      <div class="form-group">
        <label for="modal-room-name">Project / Room Name</label>
        <input type="text" id="modal-room-name" placeholder="e.g. Website Overhaul" required>
      </div>

      <div class="form-group">
        <label for="modal-client-email">Involved Emails (comma-separated)</label>
        <input type="text" id="modal-client-email" placeholder="client@example.com, partner@example.com" required>
        <small class="form-hint">Names will be automatically fetched from active Supabase accounts.</small>
      </div>
      
      <div class="modal-actions">
        <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Room</button>
      </div>
    </form>
  </div>
</div>
  <script src="/chatEngine.js"></script>
  <script src="/messages/messages.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
