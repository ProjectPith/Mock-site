<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Projects | LunarCraft</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="client-projects.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="client-projects-body">

  <div id="site-header-container"></div>

  <!-- MAIN CLIENT DASHBOARD GRID -->
  <main class="client-dashboard-grid">

    <!-- LEFT COLUMN: PROJECTS (2/3 Horizontal, Full Vertical) -->
    <section class="widget-card projects-widget">
      <div class="widget-header">
        <h3 id="projects-widget-title">Projects</h3>
        <button id="btn-back-to-projects" type="button" class="btn-sm btn-outline hidden" onclick="deselectProject()">← Back to Projects</button>
      </div>

      <div class="widget-body">

        <!-- VIEW 1: PROJECT SELECTOR LIST (DEFAULT) -->
        <div id="projects-list" class="projects-list">
          <!-- Dynamically populated project card buttons -->
        </div>

        <!-- VIEW 2: INDIVIDUAL PROJECT DETAILS (HIDDEN UNTIL CLICKED) -->
        <div id="project-details-view" class="project-details-view hidden">
          <div class="project-docs-bar">
            <div class="docs-dropdown-container">
              <button id="btn-project-docs" type="button" class="btn-docs-trigger" aria-expanded="false" aria-controls="docs-dropdown-menu">
                Docs <span class="dropdown-arrow">▾</span>
              </button>
              <div id="docs-dropdown-menu" class="docs-dropdown-menu hidden">
                <a id="doc-link-intake" class="doc-menu-item disabled" target="_blank" rel="noopener noreferrer" aria-disabled="true">Intake Form</a>
                <a id="doc-link-contract" class="doc-menu-item disabled" target="_blank" rel="noopener noreferrer" aria-disabled="true">Contract PDF</a>
              </div>
            </div>
          </div>

          <!-- THREE FULL-WIDTH LINK BOXES -->
          <div id="project-links-header" class="project-links-fullwidth">
            <button id="btn-link-live" type="button" class="fullwidth-link-box disabled">
              <span>LIVE SITE</span>
            </button>
            <button id="btn-link-test" type="button" class="fullwidth-link-box disabled">
              <span>TEST SITE</span>
            </button>
            <button id="btn-link-github" type="button" class="fullwidth-link-box disabled">
              <span>PUBLIC REPO</span>
            </button>
          </div>

          <section class="project-readonly-details" aria-labelledby="project-details-heading">
            <h4 id="project-details-heading">Project Details</h4>
            <dl id="project-details-content" class="project-details-grid">
              <p class="loading-text">Select a project to view its details.</p>
            </dl>
          </section>

        </div>

      </div>
    </section>

    <!-- RIGHT COLUMN CONTAINER (1/3 Horizontal) -->
    <div class="col-right-stack">

      <!-- TOP: MESSAGES -->
      <section class="widget-card messages-widget">
        <div class="widget-header">
          <h3>Messages</h3>
        </div>
        <div class="widget-body messages-widget-body">
          <div class="chat-toolbar">
            <select id="client-chat-room-select" class="dash-room-select" aria-label="Project chat room">
              <option value="">Select a project first</option>
            </select>
            <button id="btn-client-chat-create" type="button" class="btn-sm btn-outline" disabled>+ Create Chat</button>
          </div>

          <form id="client-chat-create-form" class="client-chat-create-form hidden">
            <label for="client-chat-name">Chat name</label>
            <input type="text" id="client-chat-name" required maxlength="100">
            <fieldset>
              <legend>Project members</legend>
              <div id="client-chat-members" class="client-chat-members"></div>
            </fieldset>
            <label for="client-chat-extra-email">Add someone outside the project</label>
            <input type="email" id="client-chat-extra-email" autocomplete="email" placeholder="person@example.com">
            <div class="chat-create-actions">
              <button type="submit" class="btn-sm btn-accent">Create Chat</button>
              <button type="button" id="btn-client-chat-cancel" class="btn-sm btn-outline">Cancel</button>
            </div>
          </form>

          <p id="client-chat-feedback" class="chat-feedback" role="status"></p>
          <div id="client-messages-list" class="client-messages-list">
            <div class="message-placeholder"><p>Select a project to view its chats.</p></div>
          </div>
          <form id="client-chat-form" class="client-chat-form">
            <input type="text" id="client-chat-input" placeholder="Type a message..." disabled required autocomplete="off">
            <button type="submit" id="client-chat-send" class="btn-sm btn-accent" disabled>Send</button>
          </form>
        </div>
      </section>

      <!-- BOTTOM: FINANCE -->
      <section class="widget-card finance-widget">
        <div class="widget-header">
          <h3>Finance</h3>
        </div>
        <div class="widget-body finance-widget-body">
          <p id="finance-placeholder" class="loading-text">Select a project to view its balance.</p>
          <div id="finance-summary" class="finance-summary hidden">
            <div class="finance-stat">
              <span>Current Balance</span>
              <strong id="finance-current-balance">$0.00</strong>
            </div>
            <div id="finance-build-row" class="finance-stat hidden">
              <span>Build Remaining</span>
              <strong id="finance-build-remaining">$0.00</strong>
            </div>
          </div>
        </div>
      </section>

    </div>

  </main>

  <!-- 5-SECOND TOAST OVERLAY -->
  <div id="toast-overlay" class="toast-overlay hidden">
    <p id="toast-message">Link has not been attached yet.</p>
  </div>

  <script src="/nav.js"></script>
  <script src="client-projects.js"></script>
</body>
</html>
