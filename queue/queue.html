<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Queue | LunarCraft</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/queue/queue.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="site-header-container"></div>

  <main class="queue-container">
    <div class="queue-header-actions">
      <h3>Incoming Orders</h3>
      <div class="queue-filters">
        <label><input type="checkbox" id="show-completed" /> Show Completed</label>
      </div>
    </div>

    <!-- Orders Table -->
    <div class="table-wrapper">
      <table class="orders-table">
        <thead>
          <tr>
            <th>Customer Email</th>
            <th>Order Date</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th style="text-align: center;">Complete</th>
          </tr>
        </thead>
        <tbody id="orders-table-body">
          <tr>
            <td colspan="6" class="loading-cell">Loading orders...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Order Details Modal -->
  <div id="order-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Order Details: <span id="customer-email"></span></h2>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <div class="modal-section">
        <h3>Shipping Address</h3>
        <p id="shipping-address"></p>
      </div>

      <div class="modal-section">
        <h3>Ordered Items</h3>
        <!-- Target container to render purchased items -->
        <ul id="ordered-items-list" class="ordered-items-list"></ul>
      </div>

      <div class="modal-section">
        <label for="tracking-input">Tracking Number (Optional for automated email):</label>
        <input type="text" id="tracking-input" class="modal-input" placeholder="e.g. 94010000000000000000" />
      </div>

      <div class="modal-actions">
        <button id="fulfill-btn" class="btn-fulfill">Fulfill & Send Email</button>
      </div>
    </div>
  </div>

  <script src="/nav.js"></script>
  <script src="/global.js"></script>
  <script src="/queue/queue.js"></script>
</body>
</html>
